version: 2
updates:
  # Keeps the dependencies current within their existing majors
  # (spec decision #7).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for the patch/minor updates instead of a dozen.
      dependencies:
        update-types:
          - "minor"
          - "patch"
    # Major updates are not part of the 1.6.x line: they need a dedicated
    # migration pass (a major can change the import style or the API), so
    # dependabot should not open them automatically.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # The workflow actions are pinned to commit SHAs; dependabot updates the
  # SHA and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
