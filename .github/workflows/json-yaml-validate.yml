name: json-yaml-validate
on:
  push:
    branches:
      - master
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.json'
  pull_request:
    branches:
      - master
      - 2.0.X
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.json'
  workflow_dispatch:

permissions:
  contents: read

# Docs-only or code pushes that touch no json/yaml no longer queue this run;
# superseded runs cancel.
concurrency:
  group: json-yaml-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  json-yaml-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: json-yaml-validate
        id: json-yaml-validate
        uses: GrantBirki/json-yaml-validate@9dbc6e6ff950c53200156e8afbc16ef1355f1c8d # v5.0.1
        with:
          comment: "false" # enable comment mode
          exclude_file: ".github/config/exclude.txt" # gitignore style file for exclusions
