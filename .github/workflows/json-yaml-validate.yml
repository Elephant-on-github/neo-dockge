name: json-yaml-validate
on:
  push:
    branches:
      - master
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.json'
  pull_request:
    branches:
      - master
      - 2.0.X
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.json'
  workflow_dispatch:

permissions:
  contents: read

# Docs-only or code pushes that touch no json/yaml no longer queue this run;
# superseded runs cancel.
concurrency:
  group: json-yaml-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  json-yaml-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: json-yaml-validate
        id: json-yaml-validate
        uses: GrantBirki/json-yaml-validate@v2.6.1
        with:
          comment: "false" # enable comment mode
          exclude_file: ".github/config/exclude.txt" # gitignore style file for exclusions
