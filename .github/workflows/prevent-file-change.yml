name: Prevent File Change

on:
  # v3 of the action only supports pull_request_target. The workflow does not
  # check out the pull request's code, it only reads the changed files through
  # the API, so the trusted-authors list keeps this safe.
  pull_request_target:

jobs:
  check-file-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent file change
        uses: xalvarez/prevent-file-change-action@dbc67c205c9ed02aa39c497b422c24f364c3e8dd # v3.0.1
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Regex, /src/lang/*.json is not allowed to be changed, except for /src/lang/en.json
          pattern: '^(?!frontend/src/lang/en\.json$)frontend/src/lang/.*\.json$'
          trustedAuthors: UptimeKumaBot
