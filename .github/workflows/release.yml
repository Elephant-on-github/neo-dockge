name: Release

# Publishes versioned images to GHCR when a semantic-version tag is pushed.
# Tag 1.6.0 -> ghcr.io/elephant-on-github/neo-dockge:1.6.0, :1, :latest
on:
  push:
    tags:
      - '*.*.*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # gh release create
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm clean-install --no-fund

      - name: Test
        run: npm test

      # The app image pulls its base/healthcheck stages from GHCR, so build and
      # push them first.
      - name: Build base + healthcheck images
        run: |
          npm run build:docker-base
          npm run build:healthcheck

      - name: Build frontend
        run: npm run build:frontend

      - name: Build and push release image
        env:
          VERSION: ${{ github.ref_name }}
        run: npm run build:docker

      # ":latest" must point at the version that was just released, otherwise
      # `docker pull ...:latest` keeps serving the previous release.
      - name: Verify the latest tag points at the released version
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Ask the registry for the manifest digest of a tag. Done through the
          # registry API (not `docker buildx imagetools`, which fails hard on
          # some runners and would abort the step before the retry loop).
          digest_of() {
            local repo="$1" tag="$2" token=""
            token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r .token 2>/dev/null) || token=""
            [ -n "$token" ] && [ "$token" != "null" ] || return 1
            curl -fsSI -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${repo}/manifests/${tag}" 2>/dev/null \
              | tr -d '\r' \
              | awk 'tolower($1) == "docker-content-digest:" {print $2; exit}'
          }
          for i in $(seq 1 12); do
            released=$(digest_of "$REPO" "$VERSION" || true)
            latest=$(digest_of "$REPO" "latest" || true)
            if [ -n "$released" ] && [ "$released" = "$latest" ]; then
              echo "latest and $VERSION both resolve to $released"
              exit 0
            fi
            echo "attempt $i: latest=$latest released=$released (registry may still be propagating)"
            sleep 10
          done
          echo "::error::latest does not point at the released version $VERSION"
          exit 1

      # The backend update checker reads this fork's latest release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes
