name: Node.js CI - neo-dockge

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# Rapid successive pushes (e.g. a fixup right after a push) should not stack
# full runs in the runner queue: the newest run supersedes older queued ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 10 # A hung install/test dies here instead of burning 6h of runner time
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24] # Matches the container base image
    runs-on: ${{ matrix.os }}
    steps:
      # Line endings must be configured BEFORE checkout: on Windows the
      # runner's autocrlf rewrites the stored LF to CRLF during checkout,
      # and eslint's linebreak-style: unix then fails every file.
      # (Upstream ran this config before checkout; the plan's "move checkout
      # first" inversion broke it — see ledger.)
      - name: Configure git line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm # keyed on package-lock.json

      # npm ci (not install): reproducible installs straight from the lockfile,
      # never mutates it in CI.
      - name: Install dependencies
        run: npm ci --no-fund

      - name: Lint
        run: npm run lint

      - name: Check Typescript
        run: npm run check-ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:frontend
