name: Node.js CI - neo-dockge

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24] # Matches the container base image
    runs-on: ${{ matrix.os }}
    steps:
      # Line endings must be configured BEFORE checkout: on Windows the
      # runner's autocrlf rewrites the stored LF to CRLF during checkout,
      # and eslint's linebreak-style: unix then fails every file.
      # (Upstream ran this config before checkout; the plan's "move checkout
      # first" inversion broke it — see ledger.)
      - name: Configure git line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-fund

      - name: Lint
        run: npm run lint

      - name: Check Typescript
        run: npm run check-ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:frontend
